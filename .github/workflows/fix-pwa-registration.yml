name: Temporary Manuscript PWA Registration Fix

on:
  push:
    branches: [pwa-upgrade-worker]
    paths:
      - '.github/workflows/fix-pwa-registration.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove misplaced duplicate PWA registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          bad = "\n".join([
              '${sanitizedPages(request)}',
              '<script>',
              'if ("serviceWorker" in navigator) {',
              '  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));',
              '}',
              '</script>',
              '</body></html>`;'
          ])
          good = '${sanitizedPages(request)}</body></html>`;'
          if bad not in html:
              raise SystemExit('Expected misplaced service-worker block not found')
          html = html.replace(bad, good, 1)
          path.write_text(html, encoding='utf-8')

          assert html.count('navigator.serviceWorker.register') == 1
          assert "navigator.serviceWorker.register('./sw.js', { scope: './' })" in html
          assert '${sanitizedPages(request)}</body></html>`;' in html
          print('Existing Manuscript service-worker registration preserved; duplicate removed')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate Manuscript PWA registration"
          git push origin HEAD:pwa-upgrade-worker
