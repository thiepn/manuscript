name: V430 P1 entry diagnostic

on:
  push:
    branches: [feat/v430-writing-experience]
    paths:
      - '.github/workflows/v430-p1-entry-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-entry-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v430-writing-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated baseline and exact P1 candidate
        shell: python
        run: |
          import subprocess, textwrap
          from pathlib import Path

          baseline = subprocess.check_output(['git','show','1e32b2d7bf6050cd6e3c41b362ee474844354c00:index.html'])
          Path('diag-base').mkdir()
          Path('diag-base/index.html').write_bytes(baseline)
          Path('diag-base/sw.js').write_bytes(Path('sw.js').read_bytes())

          workflow = Path('.github/workflows/v430-p1-bootstrap.yml').read_text(encoding='utf-8')
          marker = '      - name: Harden P1 patcher integration boundaries\n        shell: python\n        run: |\n'
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit('P1 hardening step not found')
          start += len(marker)
          end = workflow.find('\n      - name:', start)
          block = workflow[start:end]
          code = textwrap.dedent(block)
          exec(compile(code, '<p1-hardening>', 'exec'), {})
          subprocess.run(['python3','tools/apply_v430_p1.py'], check=True)

          Path('diag-p1').mkdir()
          Path('diag-p1/index.html').write_bytes(Path('index.html').read_bytes())
          Path('diag-p1/sw.js').write_bytes(Path('sw.js').read_bytes())

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve isolated candidates
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory diag-base >/tmp/base.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory diag-p1 >/tmp/p1.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..30}; do curl -fsS http://127.0.0.1:$port/index.html >/dev/null && break; sleep 1; done
            curl -fsS http://127.0.0.1:$port/index.html >/dev/null
          done

      - name: Compare Landing to Home behavior
        shell: bash
        run: |
          cat > scripts/.entry-diagnostic.mjs <<'JS'
          import { chromium } from 'playwright';

          const visible = async locator => locator.isVisible().catch(() => false);

          async function snapshot(page, label) {
            const data = await page.evaluate(() => {
              const isVisible = el => {
                const s=getComputedStyle(el),r=el.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;
              };
              return {
                screen: document.documentElement.dataset.screen || '',
                p1: !!document.querySelector('#v430-p1-runtime'),
                homes: [...document.querySelectorAll('[data-action="home"]')].map((el,i)=>({
                  i, visible:isVisible(el), tag:el.tagName,
                  text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),
                  aria:el.getAttribute('aria-label'), title:el.getAttribute('title'),
                  cls:String(el.className), parent:String(el.parentElement?.className||'')
                })),
                modal: (()=>{
                  const el=[...document.querySelectorAll('.modal-layer')].find(isVisible);
                  return el ? (el.textContent||'').trim().replace(/\s+/g,' ').slice(0,220) : null;
                })()
              };
            });
            console.log(`\n${label}\n${JSON.stringify(data,null,2)}`);
            return data;
          }

          async function closeModal(page) {
            const layer=page.locator('.modal-layer').first();
            if (!(await layer.count()) || !(await visible(layer))) return;
            const close=layer.locator('[data-action="modal-close"],.modal-close').first();
            if (await close.count()) await close.click({timeout:5000});
            else await page.keyboard.press('Escape');
            await layer.waitFor({state:'detached',timeout:5000}).catch(async()=>{
              await page.keyboard.press('Escape');
              await layer.waitFor({state:'detached',timeout:1500}).catch(()=>{});
            });
          }

          async function exactAttempt(name,url) {
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage();
            try {
              await page.goto(url,{waitUntil:'load',timeout:45000});
              await page.waitForTimeout(300);
              await snapshot(page,`${name} initial`);
              await closeModal(page);
              await snapshot(page,`${name} after closeModal`);
              const home=page.locator('[data-action="home"]').first();
              console.log(`${name}: first home visible=${await visible(home)}`);
              try { await home.click({timeout:2500}); console.log(`${name}: first home Playwright click`); }
              catch(e) {
                console.log(`${name}: Playwright click failed: ${e.message.split('\n')[0]}`);
                try { await home.evaluate(el=>el.click()); console.log(`${name}: first home DOM click`); }
                catch(e2) { console.log(`${name}: DOM click failed: ${e2.message}`); }
              }
              await page.waitForTimeout(400);
              await snapshot(page,`${name} after first-home activation`);
            } finally { await context.close(); await browser.close(); }
          }

          async function probeEveryHome(name,url) {
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            try {
              const seed=await context.newPage();
              await seed.goto(url,{waitUntil:'load'}); await seed.waitForTimeout(200);
              const count=await seed.locator('[data-action="home"]').count(); await seed.close();
              for(let i=0;i<count;i++){
                const page=await context.newPage();
                await page.goto(url,{waitUntil:'load'}); await page.waitForTimeout(200); await closeModal(page);
                const node=page.locator('[data-action="home"]').nth(i);
                let method='failed';
                try { await node.click({timeout:1800}); method='playwright'; }
                catch { try { await node.evaluate(el=>el.click()); method='dom'; } catch {} }
                await page.waitForTimeout(250);
                console.log(`${name}: home[${i}] via ${method} -> ${await page.locator('html').getAttribute('data-screen')}`);
                await page.close();
              }
            } finally { await context.close(); await browser.close(); }
          }

          for (const [name,url] of [['BASELINE','http://127.0.0.1:4173/index.html'],['P1','http://127.0.0.1:4174/index.html']]) {
            await exactAttempt(name,url);
            await probeEveryHome(name,url);
          }
          JS
          node scripts/.entry-diagnostic.mjs
