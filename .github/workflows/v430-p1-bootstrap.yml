name: V430 P1 one-shot implementation

on:
  push:
    branches: [feat/v430-writing-experience]
    paths:
      - '.github/workflows/v430-p1-bootstrap.yml'
      - 'scripts/certify-v430-p1.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-v430-p1-bootstrap
  cancel-in-progress: false

jobs:
  implement-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v430-writing-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Harden P1 patcher integration boundaries
        shell: python
        run: |
          from pathlib import Path

          path = Path('tools/apply_v430_p1.py')
          text = path.read_text(encoding='utf-8')

          old = "    host.querySelectorAll(':scope > .v430-nav-divider').forEach(el => el.remove());\n    let previous = null;"
          new = "    if (host.querySelector(':scope > .v430-nav-divider')) return;\n    let previous = null;"
          if old not in text:
              raise SystemExit('divider idempotence anchor not found')
          text = text.replace(old, new, 1)

          css_anchor = '@media (max-width: 1199px) {'
          css_insert = '''@media (min-width: 768px) {
            html[data-screen="editor"] .v430-nav-host .v430-utility-source {
              display: none !important;
            }
          }

          @media (min-width: 1200px) {
            html[data-screen="editor"] .v430-utility-trigger {
              width: auto !important;
              min-width: 72px !important;
              padding-inline: 9px !important;
            }
          }

          '''
          if css_anchor not in text:
              raise SystemExit('utility source CSS anchor not found')
          text = text.replace(css_anchor, css_insert + css_anchor, 1)

          start = text.find('  function moveUtilityPanels(host) {')
          end = text.find('  function ensureTrigger(host, preferredAnchor) {', start)
          if start < 0 or end < 0:
              raise SystemExit('utility panel function anchors not found')
          safe_utility = r'''  function configureUtilityPanels(host) {
            const utilityMenu = ensureMenu();
            for (const id of UTILITY_PANELS) {
              const source = [...host.querySelectorAll(`[data-panel="${id}"]`)]
                .find(el => !inMobileSurface(el) && !inPanelContent(el));
              if (!source) continue;
              source.classList.add('v430-utility-source');
              const label = PANEL_LABELS[id];
              if (!source.getAttribute('aria-label')) source.setAttribute('aria-label', label);
              source.setAttribute('title', label);

              let proxy = utilityMenu.querySelector(`[data-v430-utility-item="${id}"]`);
              if (!proxy) {
                proxy = document.createElement('button');
                proxy.type = 'button';
                proxy.className = 'v430-utility-proxy';
                proxy.dataset.v430UtilityItem = id;
                proxy.setAttribute('role', 'menuitem');
                proxy.setAttribute('aria-label', label);
                proxy.innerHTML = `<span class="v430-utility-copy">${label}</span>`;
                proxy.addEventListener('click', () => {
                  closeMenu();
                  const original = [...document.querySelectorAll(`[data-panel="${id}"]`)]
                    .find(el => el.classList.contains('v430-utility-source') && !inMobileSurface(el));
                  if (original) original.click();
                });
                utilityMenu.append(proxy);
              }
            }

            let themeProxy = utilityMenu.querySelector('[data-v430-utility-proxy="theme"]');
            if (!themeProxy) {
              themeProxy = document.createElement('button');
              themeProxy.type = 'button';
              themeProxy.className = 'v430-utility-proxy';
              themeProxy.dataset.v430UtilityProxy = 'theme';
              themeProxy.setAttribute('role', 'menuitem');
              themeProxy.innerHTML = '<span aria-hidden="true">◐</span><span class="v430-utility-copy">Theme</span>';
              themeProxy.addEventListener('click', () => {
                const original = [...document.querySelectorAll('[data-action="theme"]')]
                  .find(el => el !== themeProxy && !el.closest('#v430-utility-menu'));
                closeMenu();
                if (original) original.click();
              });
              utilityMenu.append(themeProxy);
            }
          }

          '''
          text = text[:start] + safe_utility + text[end:]

          enhance_anchor = "  function enhance() {\n    scheduled = false;\n    markWorkspaceModes();"
          enhance_replacement = "  function enhance() {\n    scheduled = false;\n    if (document.documentElement.dataset.screen !== 'editor') {\n      closeMenu();\n      return;\n    }\n    markWorkspaceModes();"
          if enhance_anchor not in text:
              raise SystemExit('editor-only enhance anchor not found')
          text = text.replace(enhance_anchor, enhance_replacement, 1)

          if '    moveUtilityPanels(host);' not in text:
              raise SystemExit('utility configure call anchor not found')
          text = text.replace('    moveUtilityPanels(host);', '    configureUtilityPanels(host);', 1)

          observer_anchor = "    observer.observe(document.body, {subtree: true, childList: true});"
          observer_replacement = "    observer.observe(document.documentElement, {attributes: true, attributeFilter: ['data-screen']});"
          if observer_anchor not in text:
              raise SystemExit('observer anchor not found')
          text = text.replace(observer_anchor, observer_replacement, 1)

          path.write_text(text, encoding='utf-8')
          print('P1 patcher hardened: editor-only structure, stable utility sources, bounded observer, unclipped desktop More tools')

      - name: Apply V430-P1 to certified v4.2.3 shell
        run: python3 tools/apply_v430_p1.py

      - name: Verify static contracts
        shell: bash
        run: |
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'manuscript-editor-layout-contract" content="exclusive-workspace-panes+mobile-flex-height-v1' index.html
          grep -q 'id="v423-ui-hardening"' index.html
          grep -q 'manuscript-ui-contract" content="responsive-ui-hardening-v1' index.html
          grep -q 'id="v430-p1-simplified-navigation"' index.html
          grep -q 'id="v430-p1-runtime"' index.html
          grep -q 'manuscript-writing-ui-contract" content="simplified-navigation-v1' index.html
          grep -q '<title>Manuscript v4.2.3 Stable</title>' index.html
          grep -q 'v4.2.3' sw.js

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Apply current-entry setup hardening
        run: |
          python3 tools/harden_v423_test_navigation.py
          python3 tools/stabilize_v430_boot.py

      - name: Adapt inherited Settings utility test to P1 navigation
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/certify-v423-extras.mjs')
          text=path.read_text(encoding='utf-8')
          old='''    for(const panel of['references','settings']){
            await page.locator(`[data-panel="${panel}"]`).first().click();await page.waitForTimeout(80);
            const actions=panel==='references'?['export-csl']:['request-persistence','backup-library','backup-restore-file'];
            for(const action of actions){
              const b=page.locator(`[data-action="${action}"]:visible`).first();
              check(await b.count()===1,`desktop: visible ${action} missing in ${panel}`);
              check(await fits(b),`desktop: ${action} label clipped`);
              const r=await rect(b);check(r.width>70&&r.height>=28,`desktop: ${action} unusable ${JSON.stringify(r)}`);
            }
            await page.locator(`[data-panel="${panel}"]`).first().click().catch(()=>{});
          }'''
          new='''    await closeModal(page);
          for(const panel of['references','settings']){
            if(panel==='settings'){
              await closeModal(page);
              await page.locator('.v430-utility-trigger:visible').first().click();
              await page.locator('#v430-utility-menu [data-v430-utility-item="settings"]:visible').first().click();
            }else{
              await page.locator(`[data-panel="${panel}"]`).first().click();
            }
            await page.waitForTimeout(80);
            const actions=panel==='references'?['export-csl']:['request-persistence','backup-library','backup-restore-file'];
            for(const action of actions){
              const b=page.locator(`[data-action="${action}"]:visible`).first();
              check(await b.count()===1,`desktop: visible ${action} missing in ${panel}`);
              check(await fits(b),`desktop: ${action} label clipped`);
              const r=await rect(b);check(r.width>70&&r.height>=28,`desktop: ${action} unusable ${JSON.stringify(r)}`);
            }
            if(panel==='settings'){
              await closeModal(page);
              await page.locator('.v430-utility-trigger:visible').first().click();
              await page.locator('#v430-utility-menu [data-v430-utility-item="settings"]:visible').first().click();
            }else{
              await page.locator(`[data-panel="${panel}"]`).first().click().catch(()=>{});
            }
          }'''
          if old not in text:
              raise SystemExit('desktop utility loop anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

      - name: Serve P1 application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v430-p1-http.log 2>&1 &
          echo $! > /tmp/manuscript-v430-p1-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v430-p1-http.log
          exit 1

      - name: Re-run inherited v4.2.2 + v4.2.3 responsive behavioral certification
        timeout-minutes: 12
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423.mjs

      - name: Re-run v4.2.3 utility/mobile-overlay certification
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423-extras.mjs

      - name: Certify V430-P1 navigation, utilities, and chrome contract
        timeout-minutes: 10
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v430-p1.mjs

      - name: Enforce broad zero-finding UI sweep
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/ui-sweep-v423.mjs

      - name: Restore inherited test sources and validate clean scope
        shell: bash
        run: |
          git checkout -- scripts/certify-v423.mjs scripts/certify-v423-extras.mjs scripts/ui-sweep-v423.mjs
          test -f diagnostics/ui-sweep-v423.json
          python3 - <<'PY'
          import json
          data=json.load(open('diagnostics/ui-sweep-v423.json',encoding='utf-8'))
          assert data['summary']['total']==0, data['summary']
          assert data['summary']['fatal']==0, data['summary']
          print('UI sweep:', data['summary'])
          PY

      - name: Commit certified P1 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/apply_v430_p1.py scripts/certify-v430-p1.mjs
          git diff --cached --check
          git commit -m 'feat: simplify navigation and quiet editor chrome for v4.3'
          git push origin HEAD:feat/v430-writing-experience
