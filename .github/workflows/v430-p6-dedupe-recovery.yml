name: V430 P6 mobile duplicate-id recovery

on:
  push:
    branches: [tmp/v430-p6-a11y]
    paths:
      - '.github/workflows/v430-p6-dedupe-recovery.yml'

permissions:
  contents: write

concurrency:
  group: manuscript-v430-p6-dedupe-recovery
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/v430-p6-a11y
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consolidate audited P6 fixes including mobile focus restoration
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path

          p=Path('tools/apply_v430_p6.py')
          text=p.read_text(encoding='utf-8')

          replacements=[
            ("attributeFilter:['class','data-theme','data-screen','hidden','aria-current','aria-pressed']",
             "attributeFilter:['class','data-theme','data-screen','hidden']"),
            ("    close.click();\n    requestAnimationFrame(scheduleEnhance);\n    return true;",
             "    close.click();\n    requestAnimationFrame(scheduleEnhance);\n    setTimeout(scheduleEnhance, 260);\n    return true;"),
            ("    if text.count('</head>') != 1 or text.count('</body>') != 1:\n        raise SystemExit(\"Expected unique document closing anchors\")",
             "    if '</head>' not in text or '</body>' not in text:\n        raise SystemExit(\"Document closing anchors missing\")"),
          ]
          for old,new in replacements:
            if text.count(old)!=1:
              raise SystemExit(f'P6 correction anchor count={text.count(old)}: {old[:90]}')
            text=text.replace(old,new,1)

          css_anchor="#command-search::placeholder {\n  color: inherit !important;\n  opacity: 1 !important;\n}"
          css_extra=("\n\n/* P6: preserve P4's quiet command affordance without compositing text below AA. */"
                     "\n.v430-command-trigger {\n  opacity: 1 !important;\n}"
                     "\n.v430-command-trigger > svg {\n  opacity: .72;\n}"
                     "\n.v430-command-trigger:hover > svg,"
                     "\n.v430-command-trigger:focus-visible > svg {\n  opacity: 1;\n}"
                     "\n.v430-command-shortcut {\n  color: inherit !important;\n  opacity: 1 !important;\n}"
                     "\n.v430-command-palette .command-item > kbd {\n  color: inherit !important;\n  opacity: 1 !important;\n}")
          if text.count(css_anchor)!=1:
            raise SystemExit(f'command CSS anchor count={text.count(css_anchor)}')
          text=text.replace(css_anchor,css_anchor+css_extra,1)

          selector_anchor="    '#command-search'\n  ].join(',');"
          selector_new=("    '#command-search',\n"
                        "    '#v430-command-hint',\n"
                        "    '#v430-command-hint > span',\n"
                        "    '#v430-command-hint > kbd'\n"
                        "  ].join(',');")
          if text.count(selector_anchor)!=1:
            raise SystemExit(f'contrast selector anchor count={text.count(selector_anchor)}')
          text=text.replace(selector_anchor,selector_new,1)

          old_dedupe=("      const visible = group.filter(isVisible);\n"
                      "      const hidden = group.filter(node => !isVisible(node));\n"
                      "      if (!visible.length || !hidden.length) continue;\n"
                      "      const keeper = visible[0];")
          new_dedupe=("      // Parallel document render clones may both keep non-zero boxes on mobile.\n"
                      "      // Preserve the canonical paginated preview copy, not whichever clone CSS happens\n"
                      "      // to report as visible first.\n"
                      "      const score = node =>\n"
                      "        (node.closest('.page-content.doc') ? 100 : 0) +\n"
                      "        (node.closest('#preview-scroll') ? 50 : 0) +\n"
                      "        (isVisible(node) ? 10 : 0);\n"
                      "      const keeper = [...group].sort((a, b) => score(b) - score(a))[0];")
          if text.count(old_dedupe)!=1:
            raise SystemExit(f'canonical dedupe anchor count={text.count(old_dedupe)}')
          text=text.replace(old_dedupe,new_dedupe,1)

          old_restore=("  function restoreMobileOrigin(previous) {\n"
                       "    if (!previous?.origin?.isConnected || !isVisible(previous.origin)) return;\n"
                       "    const active = document.activeElement;\n"
                       "    if (active === document.body || active === document.documentElement || !isVisible(active) || previous.root.contains(active)) {\n"
                       "      previous.origin.focus({preventScroll:true});\n"
                       "    }\n"
                       "  }")
          new_restore=("  function resolveMobileOrigin(previous) {\n"
                       "    if (previous?.origin?.isConnected && isVisible(previous.origin)) return previous.origin;\n"
                       "    const selector = previous?.kind === 'add'\n"
                       "      ? '.mobile-bottom-nav [data-action=\"workflow-content\"]'\n"
                       "      : previous?.kind === 'style'\n"
                       "        ? '.mobile-bottom-nav [data-mobile=\"style\"]'\n"
                       "        : '';\n"
                       "    if (!selector) return null;\n"
                       "    return [...document.querySelectorAll(selector)].find(isVisible) || null;\n"
                       "  }\n\n"
                       "  function restoreMobileOrigin(previous) {\n"
                       "    const origin = resolveMobileOrigin(previous);\n"
                       "    if (!origin) return;\n"
                       "    const active = document.activeElement;\n"
                       "    if (active === document.body || active === document.documentElement || !isVisible(active) || previous.root.contains(active)) {\n"
                       "      origin.focus({preventScroll:true});\n"
                       "    }\n"
                       "  }")
          if text.count(old_restore)!=1:
            raise SystemExit(f'mobile restoration anchor count={text.count(old_restore)}')
          text=text.replace(old_restore,new_restore,1)

          p.write_text(text,encoding='utf-8')

          c=Path('scripts/certify-v430-p6.mjs')
          ctext=c.read_text(encoding='utf-8')
          old="  const root=page.locator(rootSelector).filter({visible:true}).first();"
          new="  const root=page.locator(`${rootSelector}:visible`).first();"
          if ctext.count(old)!=1:
            raise SystemExit(f'P6 mobile locator correction anchor count={ctext.count(old)}')
          c.write_text(ctext.replace(old,new,1),encoding='utf-8')

          workflow=yaml.safe_load(Path('.github/workflows/v430-p6-candidate.yml').read_text(encoding='utf-8'))
          for step in workflow['jobs']['certify']['steps']:
            name=step.get('name'); run=step.get('run')
            if not name or not run or name=='Finalize P6 source review corrections':
              continue
            print(f'\n===== {name} =====',flush=True)
            env=os.environ.copy()
            env.update({str(k):str(v) for k,v in (step.get('env') or {}).items()})
            shell=step.get('shell','bash')
            cmd=['python3','-c',run] if shell=='python' else ['bash','-euo','pipefail','-c',run]
            subprocess.run(cmd,env=env,check=True)
          PY
