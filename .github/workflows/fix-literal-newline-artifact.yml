name: One-shot literal newline artifact repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-literal-newline-artifact.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Repair and verify HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          gap_re = re.compile(r'(?s)(?<=>)((?:[ \t\r\n]|\\[nr])+)(?=<)')

          head = re.search(r'(?is)<head\b[^>]*>(.*?)</head>', text)
          if not head:
              raise SystemExit('structural <head> not found')

          def clean_gap(m):
              gap = m.group(1)
              return gap.replace('\\r', '\n').replace('\\n', '\n') if ('\\n' in gap or '\\r' in gap) else gap

          cleaned = gap_re.sub(clean_gap, head.group(1))
          if cleaned != head.group(1):
              a, b = head.span(1)
              text = text[:a] + cleaned + text[b:]

          # Normalize the known TBC v3.4.0 patch block if this repository has it.
          style_re = re.compile(r'(?is)(<style id="v340-product-polish">)(.*?)(</style>)')
          m = style_re.search(text)
          if m and ('\\n' in m.group(2) or '\\r' in m.group(2)):
              inner = m.group(2).replace('\\r', '\n').replace('\\n', '\n')
              text = text[:m.start()] + m.group(1) + inner + m.group(3) + text[m.end():]

          body = re.search(r'(?is)<body\b[^>]*>', text)
          if not body:
              raise SystemExit('structural <body> not found')
          first_child = text.find('<', body.end())
          if first_child > body.end():
              prefix = text[body.end():first_child]
              if ('\\n' in prefix or '\\r' in prefix) and re.fullmatch(r'(?:\s|\\[nr])*', prefix):
                  prefix = prefix.replace('\\r', '\n').replace('\\n', '\n')
                  text = text[:body.end()] + prefix + text[first_child:]

          guard = '''<script id="literal-newline-artifact-guard">
(()=>{for(const n of Array.from(document.body.childNodes)){if(n.nodeType!==3)continue;const v=n.nodeValue||"";if(/\\\\[nr]/.test(v)&&/^(?:\\s|\\\\n|\\\\r)+$/.test(v))n.remove();}})();
</script>'''
          guard_re = re.compile(r'(?is)<script id="literal-newline-artifact-guard">.*?</script>')
          if guard_re.search(text):
              text = guard_re.sub(lambda _: guard, text, count=1)
          else:
              body = re.search(r'(?is)<body\b[^>]*>', text)
              text = text[:body.end()] + '\n' + guard + text[body.end():]

          head = re.search(r'(?is)<head\b[^>]*>(.*?)</head>', text)
          bad = [m.group(1) for m in gap_re.finditer(head.group(1)) if '\\n' in m.group(1) or '\\r' in m.group(1)]
          if bad:
              raise SystemExit(f'escaped-newline structural text remains in head: {bad!r}')

          body = re.search(r'(?is)<body\b[^>]*>', text)
          first_child = text.find('<', body.end())
          prefix = text[body.end():first_child]
          if '\\n' in prefix or '\\r' in prefix:
              raise SystemExit(f'escaped-newline text remains after body open: {prefix!r}')

          style = style_re.search(text)
          if style and ('\\n' in style.group(2) or '\\r' in style.group(2)):
              raise SystemExit('escaped-newline token remains in v340-product-polish')

          path.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          if sw.exists():
              marker = '// literal-newline-cache-refresh: 2026-09-10\n'
              sw_text = sw.read_text(encoding='utf-8')
              if marker not in sw_text:
                  sw.write_text(marker + sw_text, encoding='utf-8')

          digest = Path('V432_SHA256.txt')
          if digest.exists():
              digest.write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          test ! -f sw.js || git add sw.js
          test ! -f V432_SHA256.txt || git add V432_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: fully normalize literal newline artifacts'
            git push
          fi
