name: V430 P1 injector diagnostic

on:
  push:
    branches: [feat/v430-writing-experience]
    paths:
      - '.github/workflows/v430-p1-injector-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v430-writing-experience
      - name: Inspect candidate anchors
        shell: python
        run: |
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          for token in ['</head>','</body>','<body','<head']:
              positions=[]
              start=0
              while True:
                  i=text.find(token,start)
                  if i<0: break
                  positions.append(i)
                  start=i+1
              print(token,'count=',len(positions),'first=',positions[:5],'last=',positions[-5:])
              for i in positions[:3]+positions[-3:]:
                  lo=max(0,i-120); hi=min(len(text),i+160)
                  print('---',token,i,'---')
                  print(repr(text[lo:hi]))
          print('length',len(text))
