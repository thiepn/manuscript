name: Manuscript v4.2.2 editor/mobile hotfix

on:
  workflow_dispatch:
  push:
    branches: [fix/editor-mobile-v422]
    paths:
      - .github/workflows/editor-hotfix-v422.yml
      - tools/hotfix_v422.py
      - scripts/certify-v422.mjs

permissions:
  contents: write

concurrency:
  group: manuscript-v422-hotfix
  cancel-in-progress: true

jobs:
  hotfix-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic v4.2.2 hotfix
        run: |
          python -m py_compile tools/hotfix_v422.py
          python tools/hotfix_v422.py index.html --service-worker sw.js
          grep -q '<title>Manuscript v4.2.2 Stable</title>' index.html
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'exclusive-workspace-panes+mobile-flex-height-v1' index.html
          grep -q 'v4.2.2' sw.js

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve hotfixed application
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v422-http.log 2>&1 &
          echo $! > /tmp/manuscript-v422-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v422-http.log
          exit 1

      - name: Certify Write Split Preview and mobile editor
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v422.mjs

      - name: Record certified production hash
        shell: bash
        run: |
          sha256sum index.html | awk '{print $1}' > V422_SHA256.txt
          echo "Certified index SHA256: $(cat V422_SHA256.txt)"

      - name: Commit certified hotfix bytes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js V422_SHA256.txt
          if git diff --cached --quiet; then
            echo "Certified hotfix bytes already committed."
          else
            git commit -m "fix: Manuscript v4.2.2 editor/mobile layout [hotfix-generated]"
            git push origin HEAD:fix/editor-mobile-v422
          fi
