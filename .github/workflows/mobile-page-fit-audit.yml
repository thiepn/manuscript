name: Mobile Page Fit Regression Audit

on:
  push:
    branches: [fix/mobile-pages-fit-alignment]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-page-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate corrected candidate
        run: |
          python3 tools/fix_mobile_page_fit.py
          python3 tools/audit_v432_source.py

      - name: Install Chromium audit runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/page-fit-ui.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/page-fit-ui.log
          exit 1

      - name: Legacy responsive sweep
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/ui-sweep-v423.mjs

      - name: Deep v4.3.2 UI audit
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/audit-v432-ui.mjs

      - name: Page-fit alignment audit
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/audit-mobile-page-fit.mjs

      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-page-fit-audit
          path: diagnostics/
          if-no-files-found: warn

      - name: Commit certified generated app
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          git add index.html V432_SHA256.txt RELEASE_NOTES_v4.3.2.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: center fitted page previews'
          git push origin HEAD:fix/mobile-pages-fit-alignment
