name: V432 UI Regression Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v432-ui-regression-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ui-audit:
    if: github.head_ref == 'fix/v432-ui-regression-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate v4.3.2 hardened candidate
        run: |
          python3 tools/audit_v432_source.py
          python3 tools/apply_v432_ui_hardening.py
          python3 tools/audit_v432_source.py

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v432-ui.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v432-ui.log
          exit 1

      - name: Run legacy full UI sweep
        continue-on-error: true
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/ui-sweep-v423.mjs

      - name: Run deep boundary and gallery audit
        continue-on-error: true
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/audit-v432-ui.mjs

      - name: Gate on zero UI findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = [
              ('legacy', Path('diagnostics/ui-sweep-v423.json')),
              ('deep', Path('diagnostics/v432-ui/report.json')),
          ]
          failed = False
          for name, path in reports:
              if not path.exists():
                  print(f'{name}: missing report {path}')
                  failed = True
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              summary = data.get('summary', {})
              total = int(summary.get('total', 0) or 0)
              fatal = int(summary.get('fatal', 0) or 0)
              print(f'{name}: {summary}')
              if total or fatal:
                  failed = True
          if failed:
              raise SystemExit('UI certification requires zero findings in both suites')
          print('V432 UI certification: PASS')
          PY

      - name: Upload diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v432-ui-audit
          path: diagnostics/
          if-no-files-found: warn

      - name: Commit certified v4.3.2 application bytes
        shell: bash
        run: |
          if ! git diff --quiet -- index.html sw.js V432_SHA256.txt RELEASE_NOTES_v4.3.2.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html sw.js V432_SHA256.txt RELEASE_NOTES_v4.3.2.md
            git commit -m 'fix: harden v4.3.2 UI regressions'
            git push origin HEAD:${{ github.head_ref }}
          fi
