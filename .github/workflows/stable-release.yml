name: Manuscript v4.2.3 Stable Certification & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-v4.2.3-stable-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_STABLE_SHA256: 0c675f6145de6b18b27ff97ceb7fa827b948cc7db47fc5a9db702efef101fc44
  STABLE_FILE: Manuscript_v4.2.3_Stable.html
  STABLE_MANIFEST: Manuscript_v4.2.3_Stable_RELEASE_MANIFEST.json

jobs:
  certify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact v4.2.3 Stable bytes and contracts
        shell: bash
        run: |
          echo "$EXPECTED_STABLE_SHA256  index.html" | sha256sum --check --strict
          test "$(tr -d '\r\n' < V423_SHA256.txt)" = "$EXPECTED_STABLE_SHA256"
          grep -q '<title>Manuscript v4.2.3 Stable</title>' index.html
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'id="v423-ui-hardening"' index.html
          grep -q 'manuscript-ui-contract" content="responsive-ui-hardening-v1' index.html
          grep -q 'v4.2.3' sw.js

      - name: Harden setup-only browser navigation
        run: python3 tools/harden_v423_test_navigation.py

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve certified application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v423-http.log 2>&1 &
          echo $! > /tmp/manuscript-v423-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v423-http.log
          exit 1

      - name: Chromium + Firefox + WebKit responsive certification
        timeout-minutes: 12
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423.mjs

      - name: Certify utility controls and mobile overlays
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423-extras.mjs

      - name: Enforce zero-finding broad UI sweep
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/ui-sweep-v423.mjs

      - name: Package certified release artifacts
        shell: bash
        run: |
          cp index.html "$STABLE_FILE"
          echo "$EXPECTED_STABLE_SHA256  $STABLE_FILE" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          stable = Path(os.environ['STABLE_FILE'])
          expected = os.environ['EXPECTED_STABLE_SHA256']
          sweep = Path('diagnostics/ui-sweep-v423.json')
          sweep_data = json.loads(sweep.read_text(encoding='utf-8'))
          assert sweep_data['summary']['total'] == 0
          assert sweep_data['summary']['fatal'] == 0
          manifest = {
              'schema': 'manuscript-release-manifest-v1',
              'product': 'Manuscript',
              'version': '4.2.3',
              'channel': 'stable',
              'release_name': 'Manuscript v4.2.3 Stable',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'artifact': {
                  'filename': stable.name,
                  'bytes': stable.stat().st_size,
                  'sha256': hashlib.sha256(stable.read_bytes()).hexdigest(),
              },
              'contracts': {
                  'stable': 'production-stable-v1',
                  'editor_layout': 'exclusive-workspace-panes+mobile-flex-height-v1',
                  'responsive_ui': 'responsive-ui-hardening-v1',
                  'scroll': 'screen-scoped-scroll-ownership-v2',
                  'mobile_viewport': 'dvh-keyboard-safe-v3',
                  'themes': 'curated-interface-themes-v2',
                  'visual': 'editorial-interface-v1.1',
              },
              'certification': {
                  'primary_script': 'scripts/certify-v423.mjs',
                  'targeted_script': 'scripts/certify-v423-extras.mjs',
                  'sweep_script': 'scripts/ui-sweep-v423.mjs',
                  'profiles': 11,
                  'sweep_profiles': 7,
                  'engines': ['chromium', 'firefox', 'webkit'],
                  'desktop_modes': ['write', 'split', 'preview'],
                  'mobile_orientations': ['portrait', 'landscape'],
                  'sweep_findings': 0,
                  'passed': True,
              },
          }
          assert manifest['artifact']['sha256'] == expected
          Path(os.environ['STABLE_MANIFEST']).write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-v4.2.3-stable-certified
          path: |
            Manuscript_v4.2.3_Stable.html
            Manuscript_v4.2.3_Stable_RELEASE_MANIFEST.json
            V423_SHA256.txt
            diagnostics/ui-sweep-v423.json
            diagnostics/ui-sweep-v423.md

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify merged v4.2.3 Stable bytes and contracts
        shell: bash
        run: |
          echo "$EXPECTED_STABLE_SHA256  index.html" | sha256sum --check --strict
          test "$(tr -d '\r\n' < V423_SHA256.txt)" = "$EXPECTED_STABLE_SHA256"
          grep -q '<title>Manuscript v4.2.3 Stable</title>' index.html
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'id="v423-ui-hardening"' index.html
          grep -q 'manuscript-ui-contract" content="responsive-ui-hardening-v1' index.html
          grep -q 'v4.2.3' sw.js

      - name: Harden setup-only browser navigation
        run: python3 tools/harden_v423_test_navigation.py

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve merged Stable application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v423-http.log 2>&1 &
          echo $! > /tmp/manuscript-v423-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v423-http.log
          exit 1

      - name: Re-certify merged Stable application
        timeout-minutes: 12
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423.mjs

      - name: Re-certify utility controls and mobile overlays
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423-extras.mjs

      - name: Re-enforce zero-finding broad UI sweep
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/ui-sweep-v423.mjs

      - name: Package merged Stable release
        shell: bash
        run: |
          cp index.html "$STABLE_FILE"
          echo "$EXPECTED_STABLE_SHA256  $STABLE_FILE" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          stable = Path(os.environ['STABLE_FILE'])
          expected = os.environ['EXPECTED_STABLE_SHA256']
          sweep = Path('diagnostics/ui-sweep-v423.json')
          sweep_data = json.loads(sweep.read_text(encoding='utf-8'))
          assert sweep_data['summary']['total'] == 0
          assert sweep_data['summary']['fatal'] == 0
          manifest = {
              'schema': 'manuscript-release-manifest-v1',
              'product': 'Manuscript',
              'version': '4.2.3',
              'channel': 'stable',
              'release_name': 'Manuscript v4.2.3 Stable',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_commit': os.environ.get('GITHUB_SHA', ''),
              'artifact': {
                  'filename': stable.name,
                  'bytes': stable.stat().st_size,
                  'sha256': hashlib.sha256(stable.read_bytes()).hexdigest(),
              },
              'contracts': {
                  'stable': 'production-stable-v1',
                  'editor_layout': 'exclusive-workspace-panes+mobile-flex-height-v1',
                  'responsive_ui': 'responsive-ui-hardening-v1',
                  'scroll': 'screen-scoped-scroll-ownership-v2',
                  'mobile_viewport': 'dvh-keyboard-safe-v3',
                  'themes': 'curated-interface-themes-v2',
                  'visual': 'editorial-interface-v1.1',
              },
              'certification': {
                  'primary_script': 'scripts/certify-v423.mjs',
                  'targeted_script': 'scripts/certify-v423-extras.mjs',
                  'sweep_script': 'scripts/ui-sweep-v423.mjs',
                  'profiles': 11,
                  'sweep_profiles': 7,
                  'engines': ['chromium', 'firefox', 'webkit'],
                  'desktop_modes': ['write', 'split', 'preview'],
                  'mobile_orientations': ['portrait', 'landscape'],
                  'sweep_findings': 0,
                  'passed': True,
              },
          }
          assert manifest['artifact']['sha256'] == expected
          Path(os.environ['STABLE_MANIFEST']).write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Create or update GitHub Stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v4.2.3 >/dev/null 2>&1; then
            gh release upload v4.2.3 "$STABLE_FILE" "$STABLE_MANIFEST" V423_SHA256.txt --clobber
          else
            gh release create v4.2.3 "$STABLE_FILE" "$STABLE_MANIFEST" V423_SHA256.txt \
              --target "$GITHUB_SHA" \
              --title "Manuscript v4.2.3 Stable" \
              --notes-file RELEASE_NOTES_v4.2.3.md
          fi
