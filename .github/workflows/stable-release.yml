name: Manuscript v4.2.2 Stable Certification & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-v4.2.2-stable-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_STABLE_SHA256: deb838e5868c4f944fab92aa508170c1f046dd5faa66f2ce4bcf2951c5269606
  STABLE_FILE: Manuscript_v4.2.2_Stable.html
  STABLE_MANIFEST: Manuscript_v4.2.2_Stable_RELEASE_MANIFEST.json

jobs:
  certify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact v4.2.2 Stable bytes and contracts
        shell: bash
        run: |
          echo "$EXPECTED_STABLE_SHA256  index.html" | sha256sum --check --strict
          test "$(tr -d '\r\n' < V422_SHA256.txt)" = "$EXPECTED_STABLE_SHA256"
          grep -q '<title>Manuscript v4.2.2 Stable</title>' index.html
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'manuscript-editor-layout-contract" content="exclusive-workspace-panes+mobile-flex-height-v1' index.html
          grep -q 'v4.2.2' sw.js

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve certified application
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v422-http.log 2>&1 &
          echo $! > /tmp/manuscript-v422-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v422-http.log
          exit 1

      - name: Chromium + Firefox + WebKit desktop/mobile certification
        timeout-minutes: 12
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v422.mjs

      - name: Package certified release artifacts
        shell: bash
        run: |
          cp index.html "$STABLE_FILE"
          echo "$EXPECTED_STABLE_SHA256  $STABLE_FILE" | sha256sum --check --strict
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          stable = Path(os.environ['STABLE_FILE'])
          expected = os.environ['EXPECTED_STABLE_SHA256']
          manifest = {
              'schema': 'manuscript-release-manifest-v1',
              'product': 'Manuscript',
              'version': '4.2.2',
              'channel': 'stable',
              'release_name': 'Manuscript v4.2.2 Stable',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'artifact': {
                  'filename': stable.name,
                  'bytes': stable.stat().st_size,
                  'sha256': hashlib.sha256(stable.read_bytes()).hexdigest(),
              },
              'contracts': {
                  'stable': 'production-stable-v1',
                  'editor_layout': 'exclusive-workspace-panes+mobile-flex-height-v1',
                  'scroll': 'screen-scoped-scroll-ownership-v2',
                  'mobile_viewport': 'dvh-keyboard-safe-v3',
                  'themes': 'curated-interface-themes-v2',
                  'visual': 'editorial-interface-v1.1',
              },
              'certification': {
                  'script': 'scripts/certify-v422.mjs',
                  'profiles': 7,
                  'engines': ['chromium', 'firefox', 'webkit'],
                  'desktop_modes': ['write', 'split', 'preview'],
                  'mobile_orientations': ['portrait', 'landscape'],
                  'passed': True,
              },
          }
          assert manifest['artifact']['sha256'] == expected
          Path(os.environ['STABLE_MANIFEST']).write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-v4.2.2-stable-certified
          path: |
            Manuscript_v4.2.2_Stable.html
            Manuscript_v4.2.2_Stable_RELEASE_MANIFEST.json
            V422_SHA256.txt

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify merged v4.2.2 Stable bytes
        shell: bash
        run: |
          echo "$EXPECTED_STABLE_SHA256  index.html" | sha256sum --check --strict
          test "$(tr -d '\r\n' < V422_SHA256.txt)" = "$EXPECTED_STABLE_SHA256"
          grep -q '<title>Manuscript v4.2.2 Stable</title>' index.html
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'manuscript-editor-layout-contract" content="exclusive-workspace-panes+mobile-flex-height-v1' index.html
          grep -q 'v4.2.2' sw.js

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve merged Stable application
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v422-http.log 2>&1 &
          echo $! > /tmp/manuscript-v422-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v422-http.log
          exit 1

      - name: Re-certify merged Stable application
        timeout-minutes: 12
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v422.mjs

      - name: Package merged Stable release
        shell: bash
        run: |
          cp index.html "$STABLE_FILE"
          echo "$EXPECTED_STABLE_SHA256  $STABLE_FILE" | sha256sum --check --strict
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          stable = Path(os.environ['STABLE_FILE'])
          expected = os.environ['EXPECTED_STABLE_SHA256']
          manifest = {
              'schema': 'manuscript-release-manifest-v1',
              'product': 'Manuscript',
              'version': '4.2.2',
              'channel': 'stable',
              'release_name': 'Manuscript v4.2.2 Stable',
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_commit': os.environ.get('GITHUB_SHA', ''),
              'artifact': {
                  'filename': stable.name,
                  'bytes': stable.stat().st_size,
                  'sha256': hashlib.sha256(stable.read_bytes()).hexdigest(),
              },
              'contracts': {
                  'stable': 'production-stable-v1',
                  'editor_layout': 'exclusive-workspace-panes+mobile-flex-height-v1',
                  'scroll': 'screen-scoped-scroll-ownership-v2',
                  'mobile_viewport': 'dvh-keyboard-safe-v3',
                  'themes': 'curated-interface-themes-v2',
                  'visual': 'editorial-interface-v1.1',
              },
              'certification': {
                  'script': 'scripts/certify-v422.mjs',
                  'profiles': 7,
                  'engines': ['chromium', 'firefox', 'webkit'],
                  'desktop_modes': ['write', 'split', 'preview'],
                  'mobile_orientations': ['portrait', 'landscape'],
                  'passed': True,
              },
          }
          assert manifest['artifact']['sha256'] == expected
          Path(os.environ['STABLE_MANIFEST']).write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Create or update GitHub Stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v4.2.2 >/dev/null 2>&1; then
            gh release upload v4.2.2 "$STABLE_FILE" "$STABLE_MANIFEST" V422_SHA256.txt --clobber
          else
            gh release create v4.2.2 "$STABLE_FILE" "$STABLE_MANIFEST" V422_SHA256.txt \
              --target "$GITHUB_SHA" \
              --title "Manuscript v4.2.2 Stable" \
              --notes-file RELEASE_NOTES_v4.2.2.md
          fi
