name: Manuscript v4.3.0 Stable Certification & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-v4.3.0-stable-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_STABLE_SHA256: 11155dbeac358f6c0706a2d7c4f45db4ffc50ab8327846aa2dec9b7692509a7e
  STABLE_FILE: Manuscript_v4.3.0_Stable.html
  STABLE_MANIFEST: Manuscript_v4.3.0_Stable_RELEASE_MANIFEST.json

jobs:
  certify-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact v4.3.0 Stable bytes and contracts
        shell: bash
        run: |
          echo "$EXPECTED_STABLE_SHA256  index.html" | sha256sum --check --strict
          test "$(tr -d '\r\n' < V430_SHA256.txt)" = "$EXPECTED_STABLE_SHA256"
          grep -q '<title>Manuscript v4.3.0 Stable</title>' index.html
          grep -q 'Manuscript v4.3.0 Stable — local-first Markdown publishing studio' index.html
          grep -q "exports.APP_VERSION = '4.3.0';" index.html
          grep -q "exports.RELEASE_NAME = 'Manuscript v4.3.0 Stable';" index.html
          grep -q "exports.RELEASE_PHASE = 'V430-P8 — RC Certification & Stable Release';" index.html
          grep -q 'manuscript-release-contract" content="v4.3.0-stable-certified-v1' index.html
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'id="v423-ui-hardening"' index.html
          grep -q 'id="v430-p1-simplified-navigation"' index.html
          grep -q 'id="v430-p2-compact-density"' index.html
          grep -q 'id="v430-p3-focus-mode"' index.html
          grep -q 'id="v430-p4-command-palette"' index.html
          grep -q 'id="v430-p5-mobile-first"' index.html
          grep -q 'id="v430-p6-accessibility"' index.html
          grep -q 'id="v430-p7-responsive-hardening"' index.html
          test "$(grep -o 'manuscript-release-contract' index.html | wc -l)" -eq 1
          grep -q '`${CACHE_PREFIX}v4.3.0`' sw.js
          ! grep -q '`${CACHE_PREFIX}v4.2.3`' sw.js
          test -f RELEASE_NOTES_v4.3.0.md
          python3 -m py_compile tools/apply_v430_p8.py
          node --check scripts/certify-v430-p8.mjs
          python3 tools/apply_v430_p8.py
          test "$(sha256sum index.html | awk '{print $1}')" = "$EXPECTED_STABLE_SHA256"
          git diff --exit-code -- index.html sw.js V430_SHA256.txt tools/apply_v430_p8.py scripts/certify-v430-p8.mjs

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Apply certification-only compatibility adapters
        shell: python
        run: |
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              p=Path(path); text=p.read_text(encoding='utf-8')
              i=text.find(start); j=text.find(end,i+len(start))
              if i<0 or j<0: raise SystemExit(f'anchors missing {path}: {start} -> {end}')
              p.write_text(text[:i]+replacement.rstrip()+'\n\n'+text[j:],encoding='utf-8')

          v423 = r'''async function openHome(page) {
            await page.waitForFunction(()=>['landing','home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
            let screen=await page.locator('html').getAttribute('data-screen');
            if(screen==='editor') return 'editor';
            if(screen==='landing'){
              await closeModalIfOpen(page);
              const home=page.locator('[data-action="home"]:visible').first();
              if(await home.count()){ try{await home.click({timeout:5000});}catch{await home.evaluate(node=>node.click());} }
              else await page.locator('[data-action="home"]').first().evaluate(node=>node.click());
              await page.waitForFunction(()=>['home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
              screen=await page.locator('html').getAttribute('data-screen');
            }
            return screen;
          }

          async function openEditor(page) {
            const screen=await openHome(page);
            if(screen==='editor'){
              await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
              return;
            }
            check(screen==='home',`setup: expected home/editor, got ${screen}`);
            const onboardingBlank=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
            if(await onboardingBlank.count()){
              await onboardingBlank.click({timeout:5000});
              await page.waitForFunction(()=>document.documentElement.dataset.screen==='editor',null,{timeout:15000});
              await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
              return;
            }
            await closeModalIfOpen(page);
            const fresh=page.locator('[data-action="new"]:visible').first();
            if(await fresh.count()){try{await fresh.click({timeout:5000});}catch{await fresh.evaluate(node=>node.click());}}
            else await page.locator('[data-action="new"]').first().evaluate(node=>node.click());
            const post=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
            if(await post.count()) await post.click({timeout:5000});
            await page.waitForFunction(()=>document.documentElement.dataset.screen==='editor',null,{timeout:15000});
            await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
          }'''
          replace_between('scripts/certify-v423.mjs','async function openHome(page) {','async function chooseTheme(page, theme) {',v423)

          sweep = r'''async function openHome(page){
            await page.waitForFunction(()=>['landing','home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
            let screen=await page.locator('html').getAttribute('data-screen');
            if(screen==='editor') return 'editor';
            if(screen==='landing'){
              await closeModal(page);
              const home=page.locator('[data-action="home"]:visible').first();
              if(await home.count()){try{await home.click({timeout:5000});}catch{await home.evaluate(node=>node.click());}}
              else await page.locator('[data-action="home"]').first().evaluate(node=>node.click());
              await page.waitForFunction(()=>['home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
              screen=await page.locator('html').getAttribute('data-screen');
            }
            return screen;
          }

          async function openEditor(page){
            const screen=await openHome(page);
            if(screen==='editor'){
              await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
              return;
            }
            if(screen!=='home') throw new Error(`setup: expected home/editor, got ${screen}`);
            const blank=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
            if(await blank.count()) await blank.click({timeout:5000});
            else{
              await closeModal(page);
              const fresh=page.locator('[data-action="new"]:visible').first();
              if(await fresh.count()){try{await fresh.click({timeout:5000});}catch{await fresh.evaluate(node=>node.click());}}
              else await page.locator('[data-action="new"]').first().evaluate(node=>node.click());
              const post=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
              if(await post.count()) await post.click({timeout:5000});
            }
            await page.waitForFunction(()=>document.documentElement.dataset.screen==='editor',null,{timeout:15000});
            await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
          }'''
          replace_between('scripts/ui-sweep-v423.mjs','async function openHome(page){','async function inspect(page,stage){',sweep)

          extras = r'''async function desktopUtilityButtons(){
            const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:900}});const page=await context.newPage();page.setDefaultTimeout(7000);await page.goto(baseURL,{waitUntil:'load'});try{
              await openEditor(page); await closeModal(page);
              for(const panel of['references','settings']){
                if(panel==='settings'){
                  await closeModal(page); await page.locator('.v430-utility-trigger:visible').first().click();
                  await page.locator('#v430-utility-menu [data-v430-utility-item="settings"]:visible').first().click();
                } else await page.locator(`[data-panel="${panel}"]`).first().click();
                await page.waitForTimeout(80);
                const actions=panel==='references'?['export-csl']:['request-persistence','backup-library','backup-restore-file'];
                for(const action of actions){const b=page.locator(`[data-action="${action}"]:visible`).first();check(await b.count()===1,`desktop: visible ${action} missing in ${panel}`);check(await fits(b),`desktop: ${action} label clipped`);const r=await rect(b);check(r.width>70&&r.height>=28,`desktop: ${action} unusable ${JSON.stringify(r)}`);}
                if(panel==='settings'){
                  await closeModal(page); await page.locator('.v430-utility-trigger:visible').first().click();
                  await page.locator('#v430-utility-menu [data-v430-utility-item="settings"]:visible').first().click();
                } else await page.locator(`[data-panel="${panel}"]`).first().click().catch(()=>{});
              }
            } finally {await context.close();await browser.close();}
          }'''
          replace_between('scripts/certify-v423-extras.mjs','async function desktopUtilityButtons(){','async function tabletExport(){',extras)

          p=Path('scripts/certify-v430-p1.mjs'); text=p.read_text(encoding='utf-8')
          start=text.find('async function clickVisible(page, selector) {'); end=text.find('async function closeTransient(page) {',start)
          if start<0 or end<0: raise SystemExit('P1 clickVisible anchors missing')
          helper=r'''async function clickVisible(page, selector) {
            const deadline=Date.now()+5000;
            do {
              const nodes=page.locator(selector);
              for(let i=0;i<await nodes.count();i++) {
                const node=nodes.nth(i); await node.scrollIntoViewIfNeeded().catch(()=>{});
                if(await node.isVisible().catch(()=>false)) {try{await node.click({timeout:3000});}catch{await node.evaluate(el=>el.click());}return node;}
              }
              await page.waitForTimeout(100);
            } while(Date.now()<deadline);
            throw new Error(`No visible element for ${selector}`);
          }'''
          p.write_text(text[:start]+helper.rstrip()+'\n\n'+text[end:],encoding='utf-8')

          p=Path('scripts/certify-v430-p5.mjs'); text=p.read_text(encoding='utf-8')
          old="  check(await page.locator('.v430-mobile-command-trigger').count() === 0, `${name}: mobile command trigger leaked at >=768px`);"
          new="  check(!(await visible(page.locator('.v430-mobile-command-trigger').first())), `${name}: mobile command trigger visible at >=768px`);"
          if text.count(old)!=1: raise SystemExit(f'P5 desktop-trigger assertion anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/certify-v423.mjs'); text=p.read_text(encoding='utf-8')
          old="    check(await page.title() === 'Manuscript v4.2.3 Stable', `${profile.name}: wrong title`);"
          new="    check(await page.title() === 'Manuscript v4.3.0 Stable', `${profile.name}: wrong title`);"
          if text.count(old)!=1: raise SystemExit(f'V423 release-title assertion anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

      - name: Serve certified Stable application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/manuscript-v430-stable.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v430-stable.log
          exit 1

      - name: Certify v4.3.0 release identity and offline shell
        timeout-minutes: 15
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v430-p8.mjs

      - name: Certify V430 P1 through P7
        timeout-minutes: 48
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: |
          node scripts/certify-v430-p1.mjs
          node scripts/certify-v430-p2.mjs
          node scripts/certify-v430-p3.mjs
          node scripts/certify-v430-p4.mjs
          node scripts/certify-v430-p5.mjs
          node scripts/certify-v430-p6.mjs
          node scripts/certify-v430-p7.mjs

      - name: Re-run inherited v4.2.3 certification
        timeout-minutes: 18
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: |
          node scripts/certify-v423.mjs
          node scripts/certify-v423-extras.mjs

      - name: Enforce zero-finding broad UI sweep
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: |
          node scripts/ui-sweep-v423.mjs
          python3 - <<'PY'
          import json
          data=json.load(open('diagnostics/ui-sweep-v423.json',encoding='utf-8'))
          assert data['summary']['total']==0, data['summary']
          assert data['summary']['fatal']==0, data['summary']
          print('UI sweep:',data['summary'])
          PY

      - name: Restore adapters and prove stable bytes unchanged
        run: |
          git checkout -- scripts/certify-v423.mjs scripts/certify-v423-extras.mjs scripts/ui-sweep-v423.mjs scripts/certify-v430-p1.mjs scripts/certify-v430-p5.mjs
          echo "$EXPECTED_STABLE_SHA256  index.html" | sha256sum --check --strict
          test "$(tr -d '\r\n' < V430_SHA256.txt)" = "$EXPECTED_STABLE_SHA256"
          git diff --exit-code -- index.html sw.js V430_SHA256.txt tools/apply_v430_p8.py scripts/certify-v430-p8.mjs

      - name: Package certified Stable release
        shell: bash
        run: |
          cp index.html "$STABLE_FILE"
          echo "$EXPECTED_STABLE_SHA256  $STABLE_FILE" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          stable=Path(os.environ['STABLE_FILE'])
          expected=os.environ['EXPECTED_STABLE_SHA256']
          sweep_data=json.loads(Path('diagnostics/ui-sweep-v423.json').read_text(encoding='utf-8'))
          assert sweep_data['summary']['total']==0
          assert sweep_data['summary']['fatal']==0
          manifest={
            'schema':'manuscript-release-manifest-v1',
            'product':'Manuscript',
            'version':'4.3.0',
            'channel':'stable',
            'release_name':'Manuscript v4.3.0 Stable',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'source_commit':os.environ.get('GITHUB_SHA',''),
            'artifact':{
              'filename':stable.name,
              'bytes':stable.stat().st_size,
              'sha256':hashlib.sha256(stable.read_bytes()).hexdigest(),
            },
            'contracts':{
              'stable_release':'v4.3.0-stable-certified-v1',
              'navigation':'simplified-navigation-v1',
              'density':'compact-density-v1',
              'focus':'focus-mode-v1',
              'commands':'command-palette-v1',
              'mobile':'mobile-first-interaction-v1',
              'accessibility':'keyboard-accessibility-v1',
              'hardening':'full-regression-responsive-v1',
              'responsive_ui':'responsive-ui-hardening-v1',
            },
            'certification':{
              'release_script':'scripts/certify-v430-p8.mjs',
              'phase_scripts':[f'scripts/certify-v430-p{i}.mjs' for i in range(1,8)],
              'inherited_primary':'scripts/certify-v423.mjs',
              'inherited_targeted':'scripts/certify-v423-extras.mjs',
              'sweep_script':'scripts/ui-sweep-v423.mjs',
              'v430_counts':{'p1':6,'p2':5,'p3':5,'p4':5,'p5':8,'p6':6,'p7':9,'p8':5},
              'engines':['chromium','firefox','webkit'],
              'offline_service_worker':True,
              'sweep_findings':0,
              'passed':True,
            },
          }
          assert manifest['artifact']['sha256']==expected
          Path(os.environ['STABLE_MANIFEST']).write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload certified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-v4.3.0-stable-certified
          path: |
            Manuscript_v4.3.0_Stable.html
            Manuscript_v4.3.0_Stable_RELEASE_MANIFEST.json
            V430_SHA256.txt
            RELEASE_NOTES_v4.3.0.md
            diagnostics/ui-sweep-v423.json
            diagnostics/ui-sweep-v423.md

      - name: Create or update GitHub Stable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v4.3.0 >/dev/null 2>&1; then
            gh release upload v4.3.0 "$STABLE_FILE" "$STABLE_MANIFEST" V430_SHA256.txt --clobber
          else
            gh release create v4.3.0 "$STABLE_FILE" "$STABLE_MANIFEST" V430_SHA256.txt \
              --target "$GITHUB_SHA" \
              --title "Manuscript v4.3.0 Stable" \
              --notes-file RELEASE_NOTES_v4.3.0.md
          fi
