name: Temporary Manuscript PWA Release Coherence

on:
  push:
    branches: [pwa-upgrade-worker]
    paths:
      - '.github/workflows/pwa-release-coherence.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align cache version and certified digest
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          text = p.read_text(encoding='utf-8')
          old = "const CACHE_NAME = `${CACHE_PREFIX}v4.3.2-pwa1`;"
          new = "const CACHE_NAME = `${CACHE_PREFIX}v4.3.2`;"
          if text.count(old) != 1:
              raise SystemExit('Expected PWA cache-version anchor not found exactly once')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          sha256sum index.html | awk '{print $1}' > V432_SHA256.txt
          echo "Manuscript 4.3.2 cache/digest coherence updated"
      - name: Commit coherence update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js V432_SHA256.txt
          git commit -m "Certify Manuscript PWA release identity"
          git push origin HEAD:pwa-upgrade-worker
