name: Manuscript v4.2.3 UI audit

on:
  push:
    branches: [fix/ui-v423]
    paths:
      - scripts/audit-ui-v423.mjs
      - scripts/diagnose-ui-findings-v423.mjs
      - .github/workflows/ui-audit-v423.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[ui-audit-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium audit dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Correct audit traversal for intentional modal/duplicate controls
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/audit-ui-v423.mjs')
          text = path.read_text(encoding='utf-8')
          old = "stages.push(await auditStage(page,`panel-${panel}`,false));\n        }"
          new = "stages.push(await auditStage(page,`panel-${panel}`,false));\n          await closeModalIfOpen(page);\n        }"
          if old not in text:
              raise SystemExit('desktop panel traversal anchor not found')
          text = text.replace(old, new, 1)
          old = "const add=page.locator('[data-action=\"workflow-content\"]').first();"
          new = "const add=page.locator('.mobile-bottom-nav [data-action=\"workflow-content\"]').first();"
          if old not in text:
              raise SystemExit('mobile Add traversal anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Serve current branch application
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-ui-audit-http.log 2>&1 &
          echo $! > /tmp/manuscript-ui-audit-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-ui-audit-http.log
          exit 1
      - name: Run UI audit
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/audit-ui-v423.mjs
      - name: Run focused UI diagnostics
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/diagnose-ui-findings-v423.mjs
      - name: Commit audit report
        shell: bash
        run: |
          git checkout -- scripts/audit-ui-v423.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/ui-audit-v423.json diagnostics/ui-audit-v423.md diagnostics/ui-findings-v423.json
          if git diff --cached --quiet; then
            echo "Audit report unchanged."
            exit 0
          fi
          git commit -m "chore: capture v4.2.3 UI audit [ui-audit-generated]"
          git pull --rebase origin fix/ui-v423
          git push origin HEAD:fix/ui-v423
