name: Temporary PWA Upgrade

on:
  push:
    branches: [pwa-upgrade-worker]
    paths:
      - '.github/workflows/pwa-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Build PWA assets and patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json

          root = Path('.')
          icons = root / 'assets' / 'icons'
          icons.mkdir(parents=True, exist_ok=True)

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#3F6278"/>
            <rect x="14" y="9" width="36" height="46" rx="4" fill="#FFFEFB"/>
            <path d="M21 21v23M43 21v23M21 21l11 13 11-13" fill="none" stroke="#3F6278" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 48h24" stroke="#BFC2BC" stroke-width="2" stroke-linecap="round"/>
          </svg>'''
          (icons / 'favicon.svg').write_text(svg, encoding='utf-8')

          def draw_icon(size, maskable=False):
              bg = '#3F6278'
              im = Image.new('RGB', (size, size), bg)
              d = ImageDraw.Draw(im)
              pad = int(size * (0.20 if maskable else 0.13))
              x0, y0, x1, y1 = pad, int(size*.14), size-pad, int(size*.86)
              radius = max(4, int(size*.04))
              d.rounded_rectangle((x0,y0,x1,y1), radius=radius, fill='#FFFEFB')
              stroke = max(3, int(size*.055))
              mleft = int(size*.34); mid = size//2; mright = int(size*.66)
              top = int(size*.35); bottom = int(size*.66); valley = int(size*.53)
              d.line((mleft,bottom,mleft,top,mid,valley,mright,top,mright,bottom), fill='#3F6278', width=stroke, joint='curve')
              line_y = int(size*.74)
              d.line((int(size*.31),line_y,int(size*.69),line_y), fill='#BFC2BC', width=max(2,int(size*.018)))
              return im

          for size, name in [(32,'favicon-32.png'), (180,'apple-touch-icon.png'), (192,'icon-192.png'), (512,'icon-512.png')]:
              draw_icon(size).save(icons / name, 'PNG', optimize=True)
          draw_icon(512, True).save(icons / 'icon-maskable-512.png', 'PNG', optimize=True)
          draw_icon(256).save(icons / 'favicon.ico', 'ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])

          manifest = {
            'id': './',
            'name': 'Manuscript',
            'short_name': 'Manuscript',
            'description': 'A local-first Markdown writing and publishing studio.',
            'start_url': './',
            'scope': './',
            'display': 'standalone',
            'orientation': 'any',
            'background_color': '#F1F2F0',
            'theme_color': '#3F6278',
            'categories': ['productivity', 'writing'],
            'icons': [
              {'src':'./assets/icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./assets/icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'./assets/icons/icon-maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'}
            ]
          }
          (root / 'manifest.webmanifest').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          sw = r'''const CACHE_PREFIX = "manuscript-pwa-";
          const CACHE_NAME = `${CACHE_PREFIX}v1`;
          const SHELL = ["./", "./index.html", "./manifest.webmanifest", "./assets/icons/icon-192.png", "./assets/icons/icon-512.png", "./assets/icons/icon-maskable-512.png"];

          self.addEventListener("install", event => {
            event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(SHELL)));
            self.skipWaiting();
          });

          self.addEventListener("activate", event => {
            event.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith(CACHE_PREFIX) && key !== CACHE_NAME).map(key => caches.delete(key)))).then(() => self.clients.claim()));
          });

          self.addEventListener("fetch", event => {
            const request = event.request;
            if (request.method !== "GET") return;
            const url = new URL(request.url);
            if (url.origin !== self.location.origin) return;
            if (request.mode === "navigate") {
              event.respondWith(fetch(request).then(response => {
                const copy = response.clone();
                caches.open(CACHE_NAME).then(cache => cache.put("./index.html", copy));
                return response;
              }).catch(() => caches.match("./index.html").then(hit => hit || caches.match("./"))));
              return;
            }
            event.respondWith(fetch(request).then(response => {
              if (response && response.ok) {
                const copy = response.clone();
                caches.open(CACHE_NAME).then(cache => cache.put(request, copy));
              }
              return response;
            }).catch(() => caches.match(request)));
          });
          '''
          (root / 'sw.js').write_text(sw, encoding='utf-8')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          head_inject = '''\n  <meta name="application-name" content="Manuscript">\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-title" content="Manuscript">\n  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">\n  <link rel="icon" href="./assets/icons/favicon-32.png" type="image/png" sizes="32x32">\n  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">\n  <link rel="manifest" href="./manifest.webmanifest">\n'''
          if 'rel="manifest"' not in html:
              html = html.replace('</head>', head_inject + '</head>', 1)
          register = '''\n<script>\nif ("serviceWorker" in navigator) {\n  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));\n}\n</script>\n'''
          if 'navigator.serviceWorker.register("./sw.js")' not in html:
              html = html.replace('</body>', register + '</body>', 1)
          index.write_text(html, encoding='utf-8')

          assert 'rel="manifest"' in html
          assert 'navigator.serviceWorker.register("./sw.js")' in html
          data = json.loads((root/'manifest.webmanifest').read_text())
          assert data['display'] == 'standalone'
          for file, expected in [('icon-192.png',(192,192)),('icon-512.png',(512,512)),('icon-maskable-512.png',(512,512)),('apple-touch-icon.png',(180,180))]:
              assert Image.open(icons/file).size == expected
          print('Manuscript PWA validation passed')
          PY
      - name: Commit generated PWA upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js assets/icons
          git commit -m "Add installable PWA support" || exit 0
          git push origin HEAD:pwa-upgrade-worker
