name: V430 P3 focus mode implementation

on:
  push:
    branches: [feat/v430-writing-experience]
    paths:
      - '.github/workflows/v430-p3-bootstrap.yml'
      - 'tools/apply_v430_p3.py'
      - 'tools/refine_v430_p3_focus_layout.py'
      - 'scripts/certify-v430-p3.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manuscript-v430-p3-bootstrap
  cancel-in-progress: false

jobs:
  implement-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v430-writing-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V430-P3 to certified P2 shell
        run: python3 tools/apply_v430_p3.py

      - name: Refine P3 focus layout
        run: python3 tools/refine_v430_p3_focus_layout.py

      - name: Verify static contracts
        shell: bash
        run: |
          grep -q 'id="v422-editor-layout-hotfix"' index.html
          grep -q 'id="v423-ui-hardening"' index.html
          grep -q 'id="v430-p1-simplified-navigation"' index.html
          grep -q 'id="v430-p1-runtime"' index.html
          grep -q 'id="v430-p2-compact-density"' index.html
          grep -q 'id="v430-p3-focus-mode"' index.html
          grep -q 'id="v430-p3-runtime"' index.html
          grep -q 'manuscript-focus-mode-contract" content="distraction-free-writing-v1' index.html
          grep -q '<title>Manuscript v4.2.3 Stable</title>' index.html
          grep -q 'v4.2.3' sw.js

      - name: Install browser certification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Adapt inherited tests to current certified entry flow
        shell: python
        run: |
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              i = text.find(start)
              j = text.find(end, i + len(start))
              if i < 0 or j < 0:
                  raise SystemExit(f'function anchors missing in {path}: {start} -> {end}')
              p.write_text(text[:i] + replacement.rstrip() + '\n\n' + text[j:], encoding='utf-8')
              print(f'adapted current-entry setup in {path}')

          v423_setup = r'''async function openHome(page) {
            await page.waitForFunction(()=>['landing','home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
            let screen=await page.locator('html').getAttribute('data-screen');
            if(screen==='editor') return 'editor';
            if(screen==='landing'){
              await closeModalIfOpen(page);
              const home=page.locator('[data-action="home"]:visible').first();
              if(await home.count()) await home.click({timeout:5000});
              else await page.locator('[data-action="home"]').first().evaluate(node=>node.click());
              await page.waitForFunction(()=>['home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
              screen=await page.locator('html').getAttribute('data-screen');
            }
            return screen;
          }

          async function openEditor(page) {
            const screen=await openHome(page);
            if(screen==='editor'){
              await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
              return;
            }
            check(screen==='home',`setup: expected home/editor, got ${screen}`);
            const onboardingBlank=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
            if(await onboardingBlank.count()){
              await onboardingBlank.click({timeout:5000});
              await page.waitForFunction(()=>document.documentElement.dataset.screen==='editor',null,{timeout:15000});
              await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
              return;
            }
            await closeModalIfOpen(page);
            const fresh=page.locator('[data-action="new"]:visible').first();
            if(await fresh.count()) await fresh.click({timeout:5000});
            else await page.locator('[data-action="new"]').first().evaluate(node=>node.click());
            const post=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
            if(await post.count()) await post.click({timeout:5000});
            await page.waitForFunction(()=>document.documentElement.dataset.screen==='editor',null,{timeout:15000});
            await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
          }'''
          replace_between('scripts/certify-v423.mjs', 'async function openHome(page) {', 'async function chooseTheme(page, theme) {', v423_setup)

          sweep_setup = r'''async function openHome(page){
            await page.waitForFunction(()=>['landing','home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
            let screen=await page.locator('html').getAttribute('data-screen');
            if(screen==='editor') return 'editor';
            if(screen==='landing'){
              await closeModal(page);
              const home=page.locator('[data-action="home"]:visible').first();
              if(await home.count()) await home.click({timeout:5000});
              else await page.locator('[data-action="home"]').first().evaluate(node=>node.click());
              await page.waitForFunction(()=>['home','editor'].includes(document.documentElement.dataset.screen||''),null,{timeout:15000});
              screen=await page.locator('html').getAttribute('data-screen');
            }
            return screen;
          }

          async function openEditor(page){
            const screen=await openHome(page);
            if(screen==='editor'){
              await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
              return;
            }
            if(screen!=='home') throw new Error(`setup: expected home/editor, got ${screen}`);
            const blank=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
            if(await blank.count()) await blank.click({timeout:5000});
            else{
              await closeModal(page);
              const fresh=page.locator('[data-action="new"]:visible').first();
              if(await fresh.count()) await fresh.click({timeout:5000});
              else await page.locator('[data-action="new"]').first().evaluate(node=>node.click());
              const post=page.locator('.modal-layer [data-action="onboarding-blank"]:visible').first();
              if(await post.count()) await post.click({timeout:5000});
            }
            await page.waitForFunction(()=>document.documentElement.dataset.screen==='editor',null,{timeout:15000});
            await page.waitForSelector('.codemirror-editor .cm-scroller',{timeout:15000});
          }'''
          replace_between('scripts/ui-sweep-v423.mjs', 'async function openHome(page){', 'async function inspect(page,stage){', sweep_setup)

          extras_function = r'''async function desktopUtilityButtons(){
            const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1440,height:900}});const page=await context.newPage();page.setDefaultTimeout(7000);await page.goto(baseURL,{waitUntil:'load'});try{
              await openEditor(page);
              await closeModal(page);
              for(const panel of['references','settings']){
                if(panel==='settings'){
                  await closeModal(page);
                  await page.locator('.v430-utility-trigger:visible').first().click();
                  await page.locator('#v430-utility-menu [data-v430-utility-item="settings"]:visible').first().click();
                }else{
                  await page.locator(`[data-panel="${panel}"]`).first().click();
                }
                await page.waitForTimeout(80);
                const actions=panel==='references'?['export-csl']:['request-persistence','backup-library','backup-restore-file'];
                for(const action of actions){
                  const b=page.locator(`[data-action="${action}"]:visible`).first();
                  check(await b.count()===1,`desktop: visible ${action} missing in ${panel}`);
                  check(await fits(b),`desktop: ${action} label clipped`);
                  const r=await rect(b);check(r.width>70&&r.height>=28,`desktop: ${action} unusable ${JSON.stringify(r)}`);
                }
                if(panel==='settings'){
                  await closeModal(page);
                  await page.locator('.v430-utility-trigger:visible').first().click();
                  await page.locator('#v430-utility-menu [data-v430-utility-item="settings"]:visible').first().click();
                }else{
                  await page.locator(`[data-panel="${panel}"]`).first().click().catch(()=>{});
                }
              }
            }finally{await context.close();await browser.close();}
          }'''
          replace_between('scripts/certify-v423-extras.mjs', 'async function desktopUtilityButtons(){', 'async function tabletExport(){', extras_function)

      - name: Harden P1 compact navigation visibility for this certification run
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/certify-v430-p1.mjs')
          text = path.read_text(encoding='utf-8')
          start = text.find('async function clickVisible(page, selector) {')
          end = text.find('async function closeTransient(page) {', start)
          if start < 0 or end < 0:
              raise SystemExit('P1 clickVisible helper anchors missing')
          helper = r'''async function clickVisible(page, selector) {
            const deadline=Date.now()+5000;
            do {
              const nodes=page.locator(selector);
              for(let i=0;i<await nodes.count();i++) {
                const node=nodes.nth(i);
                await node.scrollIntoViewIfNeeded().catch(()=>{});
                if(await node.isVisible().catch(()=>false)) {
                  try { await node.click({timeout:3000}); }
                  catch { await node.evaluate(el=>el.click()); }
                  return node;
                }
              }
              await page.waitForTimeout(100);
            } while(Date.now()<deadline);
            throw new Error(`No visible element for ${selector}`);
          }'''
          path.write_text(text[:start] + helper.rstrip() + '\n\n' + text[end:], encoding='utf-8')
          print('hardened P1 compact rail visibility for P3 CI only')

      - name: Serve P3 application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manuscript-v430-p3-http.log 2>&1 &
          echo $! > /tmp/manuscript-v430-p3-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/manuscript-v430-p3-http.log
          exit 1

      - name: Re-run inherited v4.2.3 responsive certification
        timeout-minutes: 12
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423.mjs

      - name: Re-run inherited utility and mobile-overlay certification
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v423-extras.mjs

      - name: Re-run V430-P1 certification
        timeout-minutes: 10
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v430-p1.mjs

      - name: Re-run V430-P2 certification
        timeout-minutes: 8
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v430-p2.mjs

      - name: Certify V430-P3 focus mode
        timeout-minutes: 10
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v430-p3.mjs

      - name: Enforce broad zero-finding UI sweep
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/ui-sweep-v423.mjs

      - name: Restore inherited tests and validate clean certification
        shell: bash
        run: |
          git checkout -- scripts/certify-v423.mjs scripts/certify-v423-extras.mjs scripts/ui-sweep-v423.mjs scripts/certify-v430-p1.mjs
          python3 - <<'PY'
          import json
          data=json.load(open('diagnostics/ui-sweep-v423.json',encoding='utf-8'))
          assert data['summary']['total']==0, data['summary']
          assert data['summary']['fatal']==0, data['summary']
          print('UI sweep:', data['summary'])
          PY
          git diff --check

      - name: Commit certified P3 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'No P3 implementation diff to commit'; exit 1; }
          git commit -m 'feat: add reversible focus mode for v4.3'
          git push origin HEAD:feat/v430-writing-experience
