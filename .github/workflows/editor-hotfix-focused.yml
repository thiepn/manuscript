name: Manuscript focused editor diagnostics

on:
  workflow_dispatch:
  push:
    branches: [fix/editor-mobile-v422]
    paths:
      - .github/workflows/editor-hotfix-focused.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract focused mode/layout evidence
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path('index.html').read_text(encoding='utf-8')
          needles = [
            'editor-only','preview-only','mobile-hidden','editor-preview',
            'data-action="view','data-action="mode','data-action="write','data-action="preview','data-action="split',
            "case 'view", "case 'mode", "case 'write", "case 'preview", "case 'split",
            'setView','viewMode','editorMode','previewMode'
          ]
          out=[]
          for needle in needles:
            matches=list(re.finditer(re.escape(needle), source, re.I))
            out.append(f'===== {needle} ({len(matches)}) =====')
            for i,m in enumerate(matches[:50],1):
              line=source.count('\n',0,m.start())+1
              start=max(0,m.start()-500)
              end=min(len(source),m.end()+900)
              snippet=source[start:end].replace('\r','')
              out.append(f'--- #{i} source-line={line} char={m.start()} ---')
              out.append(snippet)
            out.append('')
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/editor-hotfix-focused.txt').write_text('\n'.join(out),encoding='utf-8')

      - name: Commit focused evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/editor-hotfix-focused.txt
          if git diff --cached --quiet; then
            echo "Focused diagnostics unchanged."
          else
            git commit -m "chore: capture focused editor evidence [diagnostic-generated]"
            git push origin HEAD:fix/editor-mobile-v422
          fi
