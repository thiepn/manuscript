name: Apply V431 Markdown Examples

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v431-markdown-examples-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  patch-and-certify:
    if: github.head_ref == 'feat/v431-markdown-examples'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply idempotent v4.3.1 patch
        run: |
          python3 tools/apply_v431_markdown_examples.py
          node scripts/certify-v431-examples.mjs

      - name: Commit generated application bytes
        shell: bash
        run: |
          if ! git diff --quiet -- index.html sw.js V431_SHA256.txt RELEASE_NOTES_v4.3.1.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html sw.js V431_SHA256.txt RELEASE_NOTES_v4.3.1.md
            git commit -m 'feat: add Markdown learning examples'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install browser certification
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve candidate
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v431.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v431.log
          exit 1

      - name: Browser-certify learning examples
        env:
          MANUSCRIPT_URL: http://127.0.0.1:4173/index.html
        run: node scripts/certify-v431-examples.mjs
