name: Execute final literal newline repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repair HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Structural text in head: literal backslash-n/backslash-r becomes whitespace.
          hr=re.search(r'(?is)<head\b[^>]*>(.*?)</head>',s)
          if not hr: raise SystemExit('missing head')
          gaps=re.compile(r'(?s)(?<=>)((?:[ \t\r\n]|\\[nr])+)(?=<)')
          h=gaps.sub(lambda m:m.group(1).replace('\\r','\n').replace('\\n','\n'),hr.group(1))
          if h!=hr.group(1):
              a,b=hr.span(1);s=s[:a]+h+s[b:]

          # Known malformed generated TBC style, harmlessly absent in Manuscript.
          sr=re.compile(r'(?is)(<style id="v340-product-polish">)(.*?)(</style>)')
          m=sr.search(s)
          if m:
              inner=m.group(2).replace('\\r','\n').replace('\\n','\n')
              s=s[:m.start()]+m.group(1)+inner+m.group(3)+s[m.end():]

          br=re.search(r'(?is)<body\b[^>]*>',s)
          if not br: raise SystemExit('missing body')
          child=s.find('<',br.end())
          if child>br.end():
              pre=s[br.end():child]
              if re.fullmatch(r'(?:\s|\\[nr])*',pre):
                  pre=pre.replace('\\r','\n').replace('\\n','\n')
                  s=s[:br.end()]+pre+s[child:]

          guard='''<script id="literal-newline-artifact-guard">
(()=>{for(const n of Array.from(document.body.childNodes)){if(n.nodeType!==3)continue;const v=n.nodeValue||"";if(/\\\\[nr]/.test(v)&&/^(?:\\s|\\\\n|\\\\r)+$/.test(v))n.remove();}})();
</script>'''
          gr=re.compile(r'(?is)<script id="literal-newline-artifact-guard">.*?</script>')
          if gr.search(s): s=gr.sub(lambda _:guard,s,count=1)
          else:
              br=re.search(r'(?is)<body\b[^>]*>',s)
              s=s[:br.end()]+'\n'+guard+s[br.end():]

          # Assertions catch exactly the failure mode that rendered text in the corner.
          hr=re.search(r'(?is)<head\b[^>]*>(.*?)</head>',s)
          if any(('\\n' in x.group(1) or '\\r' in x.group(1)) for x in gaps.finditer(hr.group(1))):
              raise SystemExit('bad structural escape remains in head')
          br=re.search(r'(?is)<body\b[^>]*>',s);child=s.find('<',br.end());pre=s[br.end():child]
          if '\\n' in pre or '\\r' in pre: raise SystemExit('bad structural escape remains after body')
          m=sr.search(s)
          if m and ('\\n' in m.group(2) or '\\r' in m.group(2)): raise SystemExit('bad v340 style escape remains')

          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          if sw.exists():
              marker='// literal-newline-cache-refresh: 2026-09-10\n'
              t=sw.read_text(encoding='utf-8')
              if marker not in t: sw.write_text(marker+t,encoding='utf-8')
          d=Path('V432_SHA256.txt')
          if d.exists(): d.write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          test ! -f sw.js || git add sw.js
          test ! -f V432_SHA256.txt || git add V432_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: fully normalize literal newline artifacts'
            git push
          fi
