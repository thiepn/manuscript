name: Persist V430 P1 injector repair

on:
  push:
    branches: [feat/v430-writing-experience]
    paths:
      - '.github/workflows/v430-p1-persist-injector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v430-writing-experience
          fetch-depth: 0

      - name: Repair only the P1 patcher source
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/apply_v430_p1.py')
          text = path.read_text(encoding='utf-8')
          old = "    text = text.replace('</body>', f'{SCRIPT}\\n</body>', 1)"
          new = "    body_close = text.rfind('</body>')\n    if body_close < 0:\n        raise SystemExit('Document closing </body> anchor not found')\n    text = text[:body_close] + SCRIPT + '\\n' + text[body_close:]"
          if old not in text:
              if "body_close = text.rfind('</body>')" in text:
                  print('Injector repair already present')
              else:
                  raise SystemExit('unsafe body injection anchor missing')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify repair
        run: grep -q "body_close = text.rfind('</body>')" tools/apply_v430_p1.py

      - name: Commit patcher only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apply_v430_p1.py
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: anchor P1 runtime at real document body close'
          git push origin HEAD:feat/v430-writing-experience
